[package]
name = "anti-scrolling-notch"
description = "Anti-Scrolling-Notch for Windows — retained Mochi prototype shell"
authors = ["YashwanthDevelops"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "anti_scrolling_notch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
codex-hook-contract = { path = "../codex-hook-contract" }
anti-scrolling-notch-runtime-identity = { path = "../runtime-identity" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1.1.6"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Ole",
  "Win32_System_Com",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
