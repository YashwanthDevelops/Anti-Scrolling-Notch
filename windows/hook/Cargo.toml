[package]
name = "anti-scrolling-notch-hook"
description = "Relays inherited Claude Code and verified Codex hook events to Anti-Scrolling-Notch over separate named pipes"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "anti-scrolling-notch-hook"
path = "src/main.rs"

[dependencies]
codex-hook-contract = { path = "../codex-hook-contract" }
anti-scrolling-notch-runtime-identity = { path = "../runtime-identity" }
serde_json = "1"

# Just enough Win32 to know our own SID and to check who is serving the pipe.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }
